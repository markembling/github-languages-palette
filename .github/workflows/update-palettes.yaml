name: Update palettes

on:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * *"

permissions:
  contents: read

concurrency:
  group: update-palettes
  cancel-in-progress: false

jobs:
  check-for-update:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.compare.outputs.new_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Compare latest release against committed version
        id: compare
        run: |
          latest=$(python scripts/resolve_release_url.py github-linguist/linguist)
          latest="${latest#ref=}"
          current=$(cat palettes/UPSTREAM_VERSION 2>/dev/null || echo "")
          echo "Latest release: $latest"
          echo "Currently committed: $current"
          if [ "$latest" = "$current" ]; then
            echo "new_version=false" >> "$GITHUB_OUTPUT"
          else
            echo "new_version=true" >> "$GITHUB_OUTPUT"
          fi

  update-palettes:
    needs: check-for-update
    if: needs.check-for-update.outputs.new_version == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Bootstrap environment
        run: just bootstrap

      - name: Generate palettes
        run: just all-release

      - name: Stage and check for changes
        id: git-check
        run: |
          git add palettes/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          version=$(cat palettes/UPSTREAM_VERSION)
          git commit -m "Update palettes based on Linguist ${version}"
          git push
